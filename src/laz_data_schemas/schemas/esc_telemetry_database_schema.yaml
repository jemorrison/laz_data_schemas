$schema: http://json-schema.org/draft-07/schema
$id: Telemetry.yaml
title: Telemetry DB v0.0.1
description: Configuration of data returned from a telemetry database.
type: object
required: [INSTRUME, PROGRAM, TARGET, IMGTYPE, OBSID, VISITID, SEQID, EXPID]
properties:
  TELESCOP:
    type: string 
    description: Telescope used to acquire data
  INSTRUME:
    type: string 
    description: Instrument
    enum:
      - ESC
    units: dimensionless
  PROGRAM:
    type: string
    description: Program designation
  OBSID:
    type: string
    description: Observation ID
  VISITID:
    type: string
    description: VISIT ID
  SEQID:
    type: string
    description: SEQUENCE ID
  EXPID:
    type: string
    description: Exposure ID, running counter on exposure number      
  ROLLPA:
    type: number
    description: value of the ROLL PA
  TARGET:
    type: string
    description: name of target
  IMGTYPE:
    type: string
    description: image type
  DEC_TARG:
    type: number
    description: Commanded declincation
  UDECTARG:
    type: number
    description: uncertaintiy in declination
  RA_TARG:
    type: number
    description: Commanded right ascension
  URATARG:
    type: number
    description: uncertainity in right ascension
  DHSAXIS:
    type: number
    description: dark hold axis 
  EXPTIME:
    type: number
    description: exposure time
  INNWA:
    type: number
    description: inner working angle of dark hole
  NEXP:
    type: integer
    description: Number of exposures
    minimum: 1
  OUTWA:
    type: number
    description: outer working angle of dark hole
  GS_INDEX:
    type: integer
    description: Index of guide star within list of selected GS
  GSSTARID:
    type: string
    description: GAIA identifier
  GS_RA: 
    type: number 
    description: Guide Star RA
  GS_DEC:
    type: number
    description: Guide Star Dec 
  GS_URA: 
    type: number
    description: Guide star right ascension uncertainity
  GS_UDEC:
    type: number
    description: Guide star declination uncertainity
  GS_MAG:
    type: number
    description: Guide star magnitude in Sloan R 
  GS_UMAG: 
    type: number
    description: Guide star uncertainity magnitude in Sloan R
  GS_PA: 
    type: number
    description: Guide Star position angle
  DATE_OBS:
    type: string
    description: yyyy-mm-dd, UTC data at start of exposure
  TIME_OBS:
    type: string
    description: hh:mm:ss.sss, UTC time at start of exposure
  DATE_BEG:
    type: string
    description: Date-time start of exposure
  DATE_END:
    type: string
    description: Date-time end of exposure     


