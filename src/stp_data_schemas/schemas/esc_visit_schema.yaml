$schema: http://json-schema.org/draft-07/schema
$id: Visit.yaml
title: Visit v0.0.1
description: Configuration for a Visit with all possible options.
type: object
equired: [INSTRUME, NOBS, NPOSANG, PROGMID, ROLCOUNT, ROLLPA, OBSID, VISITID, NPOSDH, IMGTYPE, OBSCOUNT]
properties:
  TELESCOP:
    type: string 
    description: Telescope used to acquire data
  INSTRUME:
    type: string 
    description: Instrument
    enum:
      - ESC
    units: dimensionless
  PROGMID:
    type: string
    description: Program designation
  NOBS:
    type: integer
    description: Number of Observations.
    minimum: 1
  OBSID:
    type: string
    description: Observation ID
  OBSCOUNT:
    type: integer
    description: Running counter of observation number
  VISITID:
    type: string
    description: Visit ID
  NPOSANG:
    type: integer
    description: Number of roll angles for observation
    minimum: 1
  ROLLPA:
    type: number
    description: value of the ROLL PA
  ROLCOUNT:
    type: integer
    description: Running counter on ROLL PA 
    minimum: 1
  NPOSDH:
    type: integer
    description: Number of Dark Holes
    minimum: 1
  TARGET:
    type: string
    description: name of target
  IMGTYPE:
    type: string
    description: image type
  DEC_MU:
    type: number
    description: Proper motion in declination 
  DEC_PROP:
    type: number
    description: Proposer declincation
  RA_MU:
    type: number
    description: Proper motion in right ascension    
  RA_PROP:
    type: number
    description: Proposers right ascension    
  EPOCH_MU:
    type: string
    description: Proper motion epoch
patternProperties:
  "^DA[0-9]{2}$":
    type: object
    required: [DHSAXIS, EXPTIME,INNWA, NEXP, OUTWA, SEQID, NPOSDH]
    properties:
      DHSAXIS:
        type: number
        description: dark hole axis
      NPOSDH:
        type: integer
        description: dark holes to dig
      DHCOUNT:
        type: integer
        description: Running counter of dark holes
      EXPTIME:
        type: number
        description: exposure time
      INNWA:
        type: number
        description: inner working angle of dark hole
      NEXP:
        type: integer
        description: Number of exposures
        minimum: 1
      OUTWA:
        type: number
        description: outer working angle of dark hole
      SEQID:
        type: string
        description: sequence ID
additionalProperties: false

